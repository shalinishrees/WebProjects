<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="todolist.css">
</head>
<body>
<div class="c">
  <h1>To-Do List</h1> 
  <hr>
  <h5>Welcome to the To-Do List application! Here you can add, view, and manage your tasks efficiently.</h5>
  <p>Create your own to-do list by adding tasks below:</p>
  <div class="input-section">
      <input type="text" id="taskInput" placeholder="Enter a new task">
      <button id="addBtn">Add</button>
    </div>
    <ul id="taskList"></ul>
    <script src="script.js"></script>
</div>
</body>
</html>
